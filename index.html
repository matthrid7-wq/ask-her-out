<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>For Ms Spontaneous 🐰</title>

<style>

html,body{
margin:0;
padding:0;
height:100%;
overflow:hidden;
font-family:-apple-system,system-ui;
background:#ffd1dc;
}

.app{
width:393px;
height:852px;
margin:auto;
display:flex;
align-items:flex-start;
justify-content:center;
padding-top:30vh;
background:linear-gradient(135deg,#ffd1dc,#ffe4e1,#fbc2eb,#fad0c4);
background-size:500% 500%;
animation:bg 18s infinite;
position:relative;
overflow:hidden;
}

@keyframes bg{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

.container{
background:white;
width:85%;
padding:26px;
border-radius:24px;
text-align:center;
box-shadow:0 20px 60px rgba(0,0,0,0.2);
z-index:10;
transform:translateY(-10vh);
}

h1{color:#ff4d6d;margin-top:0}

.story{
font-size:17px;
min-height:110px;
margin-bottom:20px;
}

.buttons{
display:flex;
justify-content:center;
gap:14px;
flex-wrap:wrap;
}

button{
width:150px;
height:150px;
border-radius:50%;
border:none;
background:#ff6b81;
color:white;
font-size:15px;
padding:16px;
cursor:pointer;
transition:.3s;
}

button:disabled{
background:#ffc6d6;
cursor:not-allowed;
}

.maybe{background:#ffb3c6}

.glow{
animation:pulse 1.5s infinite;
box-shadow:0 0 20px #ff3d6e;
}

@keyframes pulse{
0%{transform:scale(1)}
50%{transform:scale(1.08)}
100%{transform:scale(1)}
}

/* bunny */

.bunny{
position:absolute;
font-size:36px;
transition:0.8s ease;
}

/* flower burst */

.flower{
position:absolute;
font-size:30px;
animation:burst 1.5s ease-out forwards;
}

@keyframes burst{
0%{transform:scale(0)}
100%{transform:translate(var(--x),var(--y)) scale(1.4)}
}

/* floating celebration */

.float{
position:absolute;
animation:float 6s linear infinite;
}

@keyframes float{
0%{transform:translateY(100vh);opacity:0}
40%{opacity:1}
100%{transform:translateY(-10vh);opacity:0}
}

/* big bunny ending */

.bigBunny{
font-size:100px;
animation:drop 1s ease;
}

@keyframes drop{
0%{transform:translateY(-200px)}
100%{transform:translateY(0)}
}

.gift{
font-size:40px;
}

</style>
</head>

<body>

<div class="app">

<div class="container">

<h1>🐰 For Ms Spontaneous</h1>

<div class="story" id="story">
Hey Ms Spontaneous… the bunny has been looking for you.
</div>

<div id="buttons" class="buttons">
<button onclick="next()">Tell me the bunny story</button>
</div>

</div>
</div>

<script>

let step=0
let attempts=0
let size=150

const story=[
{text:"The bunny 🐇 was hopping through a hiking trail ⛰️ when it discovered chocolates 🍫.",btn:"Wait… chocolates?"},
{text:"A few hops later it found flowers 🌸 along the same trail.",btn:"Flowers too?"},
{text:"The bunny thought: whoever left these must love hiking, adventures and spontaneous trips ✈️.",btn:"Sounds interesting"},
{text:"So the bunny kept hopping… hoping to meet the girl who makes adventures exciting.",btn:"Did the bunny find her?"},
{text:"And suddenly the bunny realized something important…",btn:"What did it realize?"},
{text:"the girl he was looking for loves adventures, flowers, and spontaneous moments✨",btn:"Hmm, seems familiar🫠"}
]

function next(){

if(step>=story.length){

storyBox.innerHTML =
"🐰 Plot twist… the bunny was me the whole time.<br><br>" +
"Just a slightly nervous one trying to ask you out.<br><br>" +
"And the chocolates 🍫 and flowers 🌸 were meant for you, Ms Spontaneous.<br><br>" +
"<b>So Ms Spontaneous… would you like to go on a real adventure date with your bunny?</b>";

renderButtons()
return
}

storyBox.innerHTML=story[step].text
buttons.innerHTML=`<button onclick="next()">${story[step].btn}</button>`
step++

}

function renderButtons(){

if(attempts>=3){

buttons.innerHTML=`
<button class="glow" id="bigYes" onclick="yes()" style="width:230px;height:230px">
YES, YES, YES, I would love to...OMG I'm sooo excited!
</button>
`

return
}

let glow=attempts>0?"glow":""

buttons.innerHTML=`
<button class="maybe" onmouseover="run(this)" onclick="maybe()">Maybe later 😅</button>
<button disabled class="${glow}" style="width:${size}px;height:${size}px">Yes… I'd love to 🐇</button>
`

}

function maybe(){
attempts++
size+=40
renderButtons()
}

function run(btn){

let x=Math.random()*200-100
let y=Math.random()*200-100

btn.style.transform=`translate(${x}px,${y}px)`

}

function flowerBurst(x,y){

const flowers=["🌹","🌻","🌼","🌷","🌺"]

for(let i=0;i<60;i++){

let f=document.createElement("div")
f.className="flower"
f.innerHTML=flowers[Math.floor(Math.random()*flowers.length)]

f.style.left=x+"px"
f.style.top=y+"px"

let rx=(Math.random()*400-200)+"px"
let ry=(Math.random()*400-200)+"px"

f.style.setProperty("--x",rx)
f.style.setProperty("--y",ry)

document.body.appendChild(f)

}

}

function yes(){

let rect=document.getElementById("bigYes").getBoundingClientRect()

flowerBurst(rect.left+100,rect.top+100)

storyBox.innerHTML=
"Yayyy... you just made the bunny very happy 🐇<br><br>"+
"Go on babe… tell your bunny you’re ready. He’s been dreaming about taking you on an adventure 🥂<br>"+
"You deserve all the love from him ❤️"

buttons.innerHTML=`
<div class="bigBunny">🐰</div>
<div class="gift">🍫</div>
<div class="gift"> 🌹 </div>
`

const items=["🐇","🍫","🌸","✈️","⛰️","❤️"]

for(let i=0;i<100;i++){

let e=document.createElement("div")
e.className="float"
e.innerHTML=items[Math.floor(Math.random()*items.length)]
e.style.left=Math.random()*100+"%"
e.style.fontSize=(Math.random()*20+18)+"px"
e.style.animationDuration=(Math.random()*4+4)+"s"
document.body.appendChild(e)

}

}

let storyBox=document.getElementById("story")
let buttons=document.getElementById("buttons")

function spawn(){

let b=document.createElement("div")
b.className="bunny"
b.innerHTML="🐇"

document.querySelector(".app").appendChild(b)

move(b)

setInterval(()=>move(b),1500)

}

function move(b){

b.style.left=Math.random()*360+"px"
b.style.top=Math.random()*780+"px"

}

for(let i=0;i<6;i++)spawn()

</script>

</body>
</html>
